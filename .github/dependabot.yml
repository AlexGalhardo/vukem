version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/drivers/*"
      - "/contrib/*"
      - "/examples/blog"
      - "/examples/api"
      - "/examples/saas"
      - "/internal/bench"
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  # Workflows pin actions by commit SHA with a "# vX.Y.Z" comment; Dependabot
  # bumps both together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # The VHS recording image is pinned by digest; Dependabot bumps tag and
  # digest together.
  - package-ecosystem: docker
    directory: /docs/media
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      site-deps:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
