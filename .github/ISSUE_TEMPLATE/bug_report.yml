name: Bug report
description: Something does not work as documented.
title: "bug: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. One bug per issue. Security problems go to a
        [private advisory](https://github.com/AlexGalhardo/vukem/security/advisories/new), never here.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: The package or part of the framework. It becomes the commit scope.
      options: [router, ctx, config, validate, session, view, htmx, orm, schema, database, auth, authz, mail, cache, storage, event, queue, schedule, inertia, vite, cli, postgres, redis, mongo, otel, websocket, graphql, docs, repo, other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The actual behaviour, with the error message or output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Link the documentation page that says so, if there is one.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest code or commands that show the bug, or a repository link.
      render: go
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Vukem version
      placeholder: v0.40.0 or commit SHA
    validations:
      required: true
  - type: input
    id: go
    attributes:
      label: Go version (`go version`)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      description: Only if the bug involves the database.
      options: [Not relevant, SQLite, PostgreSQL, MySQL, MariaDB, MongoDB, Redis]
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues and found no duplicate.
          required: true
        - label: I reproduced it on the latest release.
          required: true
