name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the expected and the actual behaviour.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Code, commands or a repository link.
      render: go
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Vukem version
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: go
    attributes:
      label: Go version (`go version`)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
