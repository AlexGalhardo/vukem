name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14
      - name: go vet
        run: go vet ./...
      - name: go fix (modernizers)
        run: |
          go fix -diff ./... > fix.diff || true
          if [ -s fix.diff ]; then echo "::warning::go fix suggests changes"; cat fix.diff; fi
      - name: go fix inline wrappers
        run: go run ./internal/tools/fixinline
      # Every nested module has to resolve from its own go.mod, the way the
      # proxy serves it. The per-driver jobs below cannot catch this: their
      # "module alone" step has GOWORK=off but no build tags, and their
      # integration step has the tags but runs inside the workspace.
      - name: Nested modules resolve without the workspace
        run: go run ./internal/tools/modcheck
      - name: Site Go snippets type-check
        run: go run ./internal/tools/snippetcheck
      # Decreasing budget (COD-01): the lint job fails when a new
      # //nolint:gocognit appears. Lower the number when you remove one.
      - name: gocognit suppression budget
        env:
          GOCOGNIT_BUDGET: "26"
        run: |
          n=$(grep -rn --include='*.go' --exclude='*_test.go' 'nolint:gocognit' . | wc -l)
          echo "nolint:gocognit in non-test code: $n (budget $GOCOGNIT_BUDGET)"
          if [ "$n" -gt "$GOCOGNIT_BUDGET" ]; then
            echo "::error title=gocognit budget::$n suppressions, budget $GOCOGNIT_BUDGET; split the function instead of adding //nolint:gocognit"
            exit 1
          fi

  apidiff:
    name: API compatibility (apidiff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # release tags are the comparison base
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Install apidiff
        run: go install golang.org/x/exp/cmd/apidiff@v0.0.0-20261014143641-f0251eb4aa3e
      - name: Compare with the latest v1 tags (core v1.*, drivers/x/v1.*)
        run: go run ./internal/tools/apicheck -major v1
      # Until v1.0.0 the gate above skips every module, so report the diff
      # against the latest v0 tags without failing: incompatible changes
      # become a warning and the full report lands in the job summary.
      - name: Report changes since the latest v0 tags (informative)
        run: |
          go run ./internal/tools/apicheck -major v0 -report "$RUNNER_TEMP/apidiff.md"
          cat "$RUNNER_TEMP/apidiff.md" >> "$GITHUB_STEP_SUMMARY"
          broken=$(awk -F'|' '$2 ~ /`/ && $4+0 > 0 {print $2}' "$RUNNER_TEMP/apidiff.md" | tr -d ' `' | paste -sd, -)
          if [ -n "$broken" ]; then
            echo "::warning title=apidiff::incompatible API changes since the last v0 tag in: $broken (rename? keep a deprecated //go:fix inline alias)"
          fi

  openapi:
    name: Lint (OpenAPI golden)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the generated OpenAPI 3.1 document
        run: npx --yes @redocly/cli@1.34.3 lint --extends=minimal openapi/testdata/shop.openapi.json
      - name: Type-check the generated TypeScript and Zod
        working-directory: openapi/testdata
        run: |
          npm ci --ignore-scripts
          npx tsc --noEmit --strict --target es2020 --module esnext --moduleResolution bundler shop.types.ts shop.zod.ts reserved.zod.ts
          npx tsc --noEmit --strict --target es2022 --lib es2022,dom shop.client.ts reserved.client.ts

  markdown:
    name: Lint (Markdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: [stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: "**/go.sum"
      - name: go test
        shell: bash # PowerShell would split -coverprofile=coverage.out at the dot
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: go test (vukem_nosqlite)
        run: go test -tags vukem_nosqlite -count=1 -run TestOpenSQLiteWithoutDriver ./database/
      - name: Coverage gate
        if: matrix.os == 'ubuntu-latest'
        run: go run ./internal/tools/covergate -v coverage.out
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  mongo:
    name: Mongo driver (integration)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ["57017:27017"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Unit tests (module alone)
        working-directory: drivers/mongo
        env:
          GOWORK: "off"
        run: go test -count=1 ./...
      - name: Integration tests
        working-directory: drivers/mongo
        env:
          MONGO_URL: mongodb://localhost:57017
        run: go test -tags=integration -count=1 ./...

  otel:
    name: OpenTelemetry driver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Unit tests (module alone)
        working-directory: drivers/otel
        env:
          GOWORK: "off"
        run: go test -race -count=1 ./...
      - name: Unit tests (workspace, current core)
        working-directory: drivers/otel
        run: go test -count=1 ./...

  websocket:
    name: WebSocket driver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Unit tests (module alone)
        working-directory: drivers/websocket
        env:
          GOWORK: "off"
        run: go test -race -count=1 ./...
      - name: Unit tests (workspace, current core)
        working-directory: drivers/websocket
        run: go test -count=1 ./...

  graphql:
    name: GraphQL module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Unit tests (module alone)
        working-directory: contrib/graphql
        env:
          GOWORK: "off"
        run: go test -race -count=1 ./...
      - name: Unit tests (workspace, current core)
        working-directory: contrib/graphql
        run: go test -count=1 ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14
          working-directory: contrib/graphql

  stripe:
    name: Stripe module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Unit tests (module alone)
        working-directory: contrib/stripe
        env:
          GOWORK: "off"
        run: go test -race -count=1 ./...
      - name: Unit tests (workspace, current core)
        working-directory: contrib/stripe
        run: go test -count=1 ./...

  grpc:
    name: gRPC module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Unit tests (module alone)
        working-directory: contrib/grpc
        env:
          GOWORK: "off"
        run: go test -race -count=1 ./...
      - name: Unit tests (workspace, current core)
        working-directory: contrib/grpc
        run: go test -count=1 ./...

  imaging:
    name: Imaging module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Unit tests (module alone)
        working-directory: contrib/imaging
        env:
          GOWORK: "off"
        run: go test -race -count=1 ./...
      - name: Unit tests (workspace, current core)
        working-directory: contrib/imaging
        run: go test -count=1 ./...

  engine:
    name: Engine module (subprocess seam)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      # prlimit(1) applies the resource limits, which is the only route to
      # them from Go: syscall.Setrlimit bounds the caller and there is no
      # pre-exec hook. util-linux is present on this runner, so the limits
      # path is exercised here rather than skipped.
      - name: Check prlimit is present
        run: prlimit --version
      - name: Unit tests (module alone)
        working-directory: contrib/engine
        env:
          GOWORK: "off"
        run: go test -race -count=1 ./...
      - name: Unit tests (workspace, current core)
        working-directory: contrib/engine
        run: go test -count=1 ./...

  redis:
    name: Redis driver (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["redis:7", "valkey/valkey:8"]
    services:
      redis:
        image: ${{ matrix.image }}
        ports: ["56379:6379"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Unit tests (module alone)
        working-directory: drivers/redis
        env:
          GOWORK: "off"
        run: go test -count=1 ./...
      - name: Conformance suites (workspace, current core)
        working-directory: drivers/redis
        env:
          REDIS_URL: redis://localhost:56379/0
        run: go test -tags=integration -count=1 ./...

  s3:
    name: S3 driver (RustFS)
    runs-on: ubuntu-latest
    env:
      # Same pinned image as .config/compose.yaml.
      RUSTFS_IMAGE: rustfs/rustfs:1.0.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Start RustFS
        run: |
          docker run -d --name rustfs -p 59000:9000             -e RUSTFS_ACCESS_KEY=vukem -e RUSTFS_SECRET_KEY=vukem-secret             "$RUSTFS_IMAGE"
          for i in $(seq 1 30); do
            curl -fs http://localhost:59000/health && exit 0
            sleep 2
          done
          docker logs rustfs
          exit 1
      - name: Unit tests (module alone)
        working-directory: drivers/s3
        env:
          GOWORK: "off"
        run: go test -count=1 ./...
      - name: Conformance suite (workspace, current core)
        working-directory: drivers/s3
        env:
          S3_ENDPOINT: http://localhost:59000
          S3_ACCESS_KEY_ID: vukem
          S3_SECRET_ACCESS_KEY: vukem-secret
        run: go test -tags=integration -count=1 ./...

  mysql:
    name: MySQL driver (MySQL 8.4, MariaDB 11.8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: vukem
          MYSQL_USER: vukem
          MYSQL_PASSWORD: vukem
          MYSQL_DATABASE: vukem_test
        ports: ["53306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uvukem -pvukem" --health-interval 2s --health-retries 60
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: vukem
          MARIADB_USER: vukem
          MARIADB_PASSWORD: vukem
          MARIADB_DATABASE: vukem_test
        ports: ["53307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 2s --health-retries 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Unit tests (module alone)
        working-directory: drivers/mysql
        env:
          GOWORK: "off"
        run: go test -count=1 ./...
      - name: Conformance suites (workspace, current core)
        working-directory: drivers/mysql
        env:
          MYSQL_URL: mysql://vukem:vukem@localhost:53306/vukem_test
          MARIADB_URL: mariadb://vukem:vukem@localhost:53307/vukem_test
        run: go test -tags=integration -count=1 ./...

  postgres:
    name: Postgres driver (integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vukem
          POSTGRES_PASSWORD: vukem
          POSTGRES_DB: vukem_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U vukem" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Unit tests (module alone)
        working-directory: drivers/postgres
        env:
          GOWORK: "off"
        run: go test -count=1 ./...
      - name: Conformance suite (workspace, current core)
        working-directory: drivers/postgres
        run: go test -tags=integration -count=1 ./...
      - name: Example blog on SQLite
        working-directory: examples/blog
        env:
          GOWORK: "off"
        run: go test -count=1 ./...
      - name: Example blog on Postgres
        working-directory: examples/blog
        env:
          GOWORK: "off"
          TEST_DATABASE_URL: postgres://vukem:vukem@localhost:55432/vukem_test?sslmode=disable
        run: go test -count=1 ./tests/
      - name: Example JSON API
        working-directory: examples/api
        env:
          GOWORK: "off"
        run: go test -count=1 ./...
      - name: Example SaaS (Go, no Node needed)
        working-directory: examples/saas
        env:
          GOWORK: "off"
        run: go test -count=1 ./...
      - name: Example SaaS front end (type-check and build)
        working-directory: examples/saas
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
