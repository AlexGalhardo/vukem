name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
      - name: go vet
        run: go vet ./...
      - name: go fix (modernizers)
        run: |
          go fix -diff ./... > fix.diff || true
          if [ -s fix.diff ]; then echo "::warning::go fix suggests changes"; cat fix.diff; fi

  openapi:
    name: Lint (OpenAPI golden)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate the generated OpenAPI 3.1 document
        run: npx --yes @redocly/cli@1.34.3 lint --extends=minimal openapi/testdata/shop.openapi.json
      - name: Type-check the generated TypeScript and Zod
        working-directory: openapi/testdata
        run: |
          npm init -y > /dev/null
          npm i --no-save typescript@5.9.3 zod@3.25.76
          npx tsc --noEmit --strict --target es2020 --module commonjs --moduleResolution node shop.types.ts shop.zod.ts

  markdown:
    name: Lint (Markdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"

  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: [stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: "**/go.sum"
      - name: go test
        shell: bash # PowerShell would split -coverprofile=coverage.out at the dot
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  redis:
    name: Redis driver (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["redis:7", "valkey/valkey:8"]
    services:
      redis:
        image: ${{ matrix.image }}
        ports: ["56379:6379"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Unit tests (module alone)
        working-directory: drivers/redis
        env:
          GOWORK: "off"
        run: go test -count=1 ./...
      - name: Conformance suites (workspace, current core)
        working-directory: drivers/redis
        env:
          REDIS_URL: redis://localhost:56379/0
        run: go test -tags=integration -count=1 ./...

  postgres:
    name: Postgres driver (integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vukem
          POSTGRES_PASSWORD: vukem
          POSTGRES_DB: vukem_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U vukem" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Unit tests (module alone)
        working-directory: drivers/postgres
        env:
          GOWORK: "off"
        run: go test -count=1 ./...
      - name: Conformance suite (workspace, current core)
        working-directory: drivers/postgres
        run: go test -tags=integration -count=1 ./...
      - name: Example blog on SQLite
        working-directory: examples/blog
        env:
          GOWORK: "off"
        run: go test -count=1 ./...
      - name: Example blog on Postgres
        working-directory: examples/blog
        env:
          GOWORK: "off"
          TEST_DATABASE_URL: postgres://vukem:vukem@localhost:55432/vukem_test?sslmode=disable
        run: go test -count=1 ./tests/
