name: Secrets

# Betterleaks scans the commits a push or pull request adds, and the whole
# history weekly (a new rule can find an old leak). Config: .betterleaks.toml;
# reviewed findings: .betterleaksignore (docs/maintenance.md#secret-scanning).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  BETTERLEAKS_VERSION: 1.9.0
  # sha256 of betterleaks_1.9.0_linux_x64.tar.gz from the release's checksums.txt
  BETTERLEAKS_SHA256: f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7

jobs:
  betterleaks:
    name: Betterleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Betterleaks
        run: |
          archive="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/${archive}"
          echo "${BETTERLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" betterleaks
          sudo install betterleaks /usr/local/bin/betterleaks
          betterleaks version
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          range=""
          case "$EVENT" in
            pull_request) range="$PR_BASE..$HEAD_SHA" ;;
            push) [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] && range="$PUSH_BEFORE..$HEAD_SHA" ;;
          esac
          # Validation stays off: it would send findings to credential providers.
          betterleaks git . --config .betterleaks.toml --no-banner --redact --log-opts="$range"
