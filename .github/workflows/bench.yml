name: Bench

# Manual only: shared runners are too noisy to gate merges on timings.
# Results are uploaded for comparison with docs/performance.md.
on:
  workflow_dispatch:
    inputs:
      count:
        description: Runs per benchmark (benchstat needs >= 6 for confidence intervals)
        default: "6"

permissions:
  contents: read

jobs:
  bench:
    name: Benchmarks (ubuntu)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      COUNT: ${{ inputs.count }}
    defaults:
      run:
        shell: bash # -o pipefail, so a failing benchmark is not hidden by tee
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Core micro-benchmarks
        run: go test -run '^$' -bench . -benchmem -count "$COUNT" ./router ./web ./orm | tee core.txt
      - name: Comparative benchmarks (net/http, chi, echo)
        working-directory: internal/bench
        run: go test -run '^$' -bench . -benchmem -count "$COUNT" . | tee ../../compare.txt
      - name: Summarize with benchstat
        run: |
          go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e
          "$(go env GOPATH)/bin/benchstat" core.txt | tee core.benchstat.txt
          "$(go env GOPATH)/bin/benchstat" -col /impl compare.txt | tee compare.benchstat.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench
          path: "*.txt"
