name: Starter dependencies

# The dependencies "vukem new" scaffolds (Vite, Tailwind, Inertia, htmx,
# Biome...) follow their latest stable release, never a pre-release. Weekly,
# starterdeps rewrites the pins, the starter end-to-end tests prove the new
# set still installs and builds, and a pull request carries the result
# (docs/maintenance.md, docs/tooling.md). A failed run opens a ci-failure
# issue through ci-failure.yml.
on:
  schedule:
    - cron: "43 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starter-deps
  cancel-in-progress: false

jobs:
  bump:
    name: Bump starter dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: chore/starter-deps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Write the latest stable versions
        run: go run ./internal/tools/starterdeps -write
      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Starter end-to-end tests
        if: steps.diff.outputs.changed == 'true'
        run: go test ./internal/cli/ -run 'TestNewInertiaProjectEndToEnd|TestNewProjectEndToEnd$|TestVendoredHTMX|TestNewStandardsFlags' -timeout 20m
      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -A internal/cli
          git commit -m "build(cli): move the starter dependencies to their latest stable releases" \
            -m "Generated by internal/tools/starterdeps -write."
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "build(cli): move the starter dependencies to their latest stable releases" \
              --body "Weekly run of \`go run ./internal/tools/starterdeps -write\`. The starter end-to-end tests passed on this branch; push an empty commit to run the required checks (a pull request opened with GITHUB_TOKEN does not trigger them)."
          fi
