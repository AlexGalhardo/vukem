name: Starter dependencies

# Everything "vukem new" scaffolds (npm packages, Docker image digests,
# GitHub Actions SHAs, package manager and tool versions) follows its latest
# stable release, never a pre-release. Weekly, starterdeps rewrites the pins
# and the version mentions in the docs, the starter end-to-end tests prove the
# new set still installs and builds, and a pull request carries the result
# (docs/maintenance.md, docs/tooling.md). A failed run opens a ci-failure
# issue through ci-failure.yml.
#
# STARTER_DEPS_TOKEN (fine-grained PAT or GitHub App token with contents and
# pull requests write) is optional: a push and a pull request made with it
# trigger the required checks, which GITHUB_TOKEN ones do not.
on:
  schedule:
    - cron: "43 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starter-deps
  cancel-in-progress: false

jobs:
  bump:
    name: Bump starter dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.STARTER_DEPS_TOKEN || github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      HAVE_PAT: ${{ secrets.STARTER_DEPS_TOKEN != '' }}
      BRANCH: chore/starter-deps
      TITLE: "build(cli): move the starter dependencies to their latest stable releases"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.STARTER_DEPS_TOKEN || github.token }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Write the latest stable versions
        run: go run ./internal/tools/starterdeps -write
      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Starter end-to-end tests
        if: steps.diff.outputs.changed == 'true'
        run: go test ./internal/cli/ -run 'TestNewInertiaProjectEndToEnd|TestNewProjectEndToEnd$|TestVendoredHTMX|TestNewStandardsFlags|TestScaffoldImagesArePinnedByDigest' -timeout 20m
      - name: Commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -A .
          git commit -m "$TITLE" -m "Generated by internal/tools/starterdeps -write."
      # The "Last updated" date comes from git history, so it is refreshed
      # after the pages are committed (docs/maintenance.md).
      - name: Refresh the docs last updated dates
        if: steps.diff.outputs.changed == 'true'
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^site/content/docs/'; then
            (cd site && npm ci && npm run last-updated)
            if ! git diff --quiet; then
              git add site/content/last-updated.json
              git commit -m "docs(site): refresh the last updated dates"
            fi
          fi
      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        run: |
          git push --force origin "$BRANCH"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            exit 0
          fi
          if ! out=$(gh pr create --base main --head "$BRANCH" --title "$TITLE" \
            --body "Weekly run of \`go run ./internal/tools/starterdeps -write\`. The starter end-to-end tests passed on this branch." 2>&1); then
            echo "$out"
            echo "::error::Could not open the pull request. Enable Settings > Actions > General > Workflow permissions > 'Allow GitHub Actions to create and approve pull requests', or add a STARTER_DEPS_TOKEN secret (fine-grained PAT or GitHub App token with contents and pull requests write). The branch $BRANCH is already pushed."
            exit 1
          fi
          echo "$out"
          if [ "$HAVE_PAT" != "true" ]; then
            echo "::notice::The pull request was opened with GITHUB_TOKEN, so the required checks do not run: push an empty commit to $BRANCH (or set STARTER_DEPS_TOKEN)."
          fi
