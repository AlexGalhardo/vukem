# git-cliff configuration: Conventional Commits -> Keep a Changelog 1.1.0.
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits %}\
- {% if commit.breaking and "Breaking" not in group %}**BREAKING:** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first | replace(from="<", to="\\<") }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/AlexGalhardo/vukem/commit/{{ commit.id }}))
{% endfor %}\
{% endfor %}
"""
footer = """
{% for release in releases -%}
{% if release.version -%}
{% if release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/AlexGalhardo/vukem/compare/{{ release.previous.version }}...{{ release.version }}
{% else -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/AlexGalhardo/vukem/releases/tag/{{ release.version }}
{% endif -%}
{% else -%}
[Unreleased]: https://github.com/AlexGalhardo/vukem/compare/{{ release.previous.version }}...HEAD
{% endif -%}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+'
sort_commits = "oldest"
commit_parsers = [
  { message = '^chore\(release\)', skip = true },
  { footer = "^Deprecated", group = "<!-- 3 -->Deprecated" },
  { message = "^(docs|test|ci|build|chore|style)", skip = true },
  # Security is explicit: a "Security:" footer on a feat, fix, perf or
  # refactor commit. Matching the word in the body filed unrelated commits
  # (a feature whose test is named TestSecurity_*) under Security. A breaking
  # security fix stays here, its line prefixed with BREAKING.
  { footer = "^Security", group = "<!-- 6 -->Security" },
  # Breaking comes first in a release: "!" after the type or scope, or a
  # "BREAKING CHANGE:" footer, which also marks a new refusal at run time
  # (a migration, a request or a boot that used to pass and now fails).
  { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking" },
  { message = "^feat", group = "<!-- 1 -->Added" },
  { message = "^(perf|refactor)", group = "<!-- 2 -->Changed" },
  { message = "^revert", group = "<!-- 4 -->Removed" },
  { message = "^fix", group = "<!-- 5 -->Fixed" },
]
