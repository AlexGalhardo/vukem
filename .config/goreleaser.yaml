# GoReleaser builds the vukem CLI binaries for a tag and attaches them to
# the GitHub release created by internal/tools/release (notes come from
# CHANGELOG.md, so GoReleaser keeps them). See docs/tooling.md.
version: 2

project_name: vukem

builds:
  - id: vukem
    main: ./cmd/vukem
    binary: vukem
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w"]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - name_template: "vukem_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, CHANGELOG.md]

checksum:
  name_template: checksums.txt

# One SPDX SBOM per archive (<archive>.sbom.json); needs syft on PATH.
sboms:
  - artifacts: archive

# Keyless: cosign gets its identity from the GitHub Actions OIDC token, so this
# only works in release.yml (task release:binaries passes --skip=sign). Signing
# checksums.txt covers every archive and SBOM it lists.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: true

release:
  mode: keep-existing
  prerelease: auto
