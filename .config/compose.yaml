# Services for integration tests: `task services:up`, then `task test:integration`.
# The project name is pinned: this file lives in .config/, and Compose would
# otherwise name the containers after that folder.
name: vukem
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: vukem
      POSTGRES_PASSWORD: vukem
      POSTGRES_DB: vukem_test
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vukem"]
      interval: 2s
      retries: 30
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: vukem
      MYSQL_USER: vukem
      MYSQL_PASSWORD: vukem
      MYSQL_DATABASE: vukem_test
    ports: ["53306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uvukem", "-pvukem"]
      interval: 2s
      retries: 60
  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: vukem
      MARIADB_USER: vukem
      MARIADB_PASSWORD: vukem
      MARIADB_DATABASE: vukem_test
    ports: ["53307:3306"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 60
  redis:
    image: redis:7
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
  mongo:
    image: mongo:8
    ports: ["57017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 3s
      retries: 30
  rustfs:
    # S3-compatible server for drivers/s3 (MinIO stopped publishing images and
    # archived its repository). Pin a stable release, never latest or preview.
    image: rustfs/rustfs:1.0.2
    environment:
      RUSTFS_ACCESS_KEY: vukem
      RUSTFS_SECRET_KEY: vukem-secret
    ports: ["59000:9000"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 2s
      retries: 30
