# Services for integration tests: `task services:up`, then `task test:integration`.
# The project name is pinned: this file lives in .config/, and Compose would
# otherwise name the containers after that folder.
name: vukem
services:
  postgres:
    image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    environment:
      POSTGRES_USER: vukem
      POSTGRES_PASSWORD: vukem
      POSTGRES_DB: vukem_test
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vukem"]
      interval: 2s
      retries: 30
  mysql:
    image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    environment:
      MYSQL_ROOT_PASSWORD: vukem
      MYSQL_USER: vukem
      MYSQL_PASSWORD: vukem
      MYSQL_DATABASE: vukem_test
    ports: ["127.0.0.1:53306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uvukem", "-pvukem"]
      interval: 2s
      retries: 60
  mariadb:
    image: mariadb:11.8@sha256:c4124d1afa875e47f2892edf26b482fa54f796e2f342d3717a04ca091a22a9bd
    environment:
      MARIADB_ROOT_PASSWORD: vukem
      MARIADB_USER: vukem
      MARIADB_PASSWORD: vukem
      MARIADB_DATABASE: vukem_test
    ports: ["127.0.0.1:53307:3306"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 60
  redis:
    image: redis:7@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
  mongo:
    image: mongo:9.0.4@sha256:452bdaf2127b8ff851e31410a267809b9829eded219979f2210e7c7efb85a058
    ports: ["127.0.0.1:57017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 3s
      retries: 30
  rustfs:
    # S3-compatible server for drivers/s3 (MinIO stopped publishing images and
    # archived its repository). Pin a stable release, never latest or preview.
    image: rustfs/rustfs:1.0.2@sha256:7e948dad4748bda48f8985fda7195f8cf2e4259427011f6120acc2c9acf51587
    environment:
      RUSTFS_ACCESS_KEY: vukem
      RUSTFS_SECRET_KEY: vukem-secret
    ports: ["127.0.0.1:59000:9000"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 2s
      retries: 30
