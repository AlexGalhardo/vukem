<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{block "title" .}}Vukem{{end}}</title>
	<meta property="csp-nonce" nonce="{{cspNonce}}">
	{{/* htmx first: deferred and module scripts run in document order, so app.ts can use window.htmx. */}}
	{{htmxScript (asset "js/htmx.min.js")}}
	{{vite "resources/css/app.css" "resources/js/app.ts"}}
</head>
<body>
	<header>
		<a href="{{route "home"}}" class="brand">Vukem</a>
		<nav><a href="{{route "posts.index"}}">Posts</a> <a href="{{route "uploads.index"}}">Uploads</a></nav>
	</header>
	<main>
		{{with flash "success"}}<p class="flash" role="status">{{.}}</p>{{end}}
		{{block "content" .}}{{end}}
	</main>
</body>
</html>
