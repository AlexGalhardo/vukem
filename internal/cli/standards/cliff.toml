# git-cliff configuration: Conventional Commits -> Keep a Changelog 1.1.0.
# https://git-cliff.org/docs/configuration
#
# Print the section for the next release and paste it under the header of
# CHANGELOG.md, replacing "[Unreleased]":
#
#   git cliff --config .config/cliff.toml --unreleased --tag vX.Y.Z --strip header
#
# CHANGELOG.md stays hand-editable that way, which Keep a Changelog expects:
# entries that no commit message explains still belong in it. `--output
# CHANGELOG.md` rewrites the whole file instead, and loses them.
#
# Add a [remote.github] section with your owner and repo to turn the commit
# hashes into links: https://git-cliff.org/docs/configuration/remote

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits %}\
- {% if commit.breaking %}**BREAKING:** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} (`{{ commit.id | truncate(length=7, end="") }}`)
{% endfor %}\
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+'
sort_commits = "oldest"
commit_parsers = [
  { message = '^chore\(release\)', skip = true },
  { body = "(?i)security", group = "<!-- 5 -->Security" },
  { footer = "^Deprecated", group = "<!-- 2 -->Deprecated" },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^(perf|refactor)", group = "<!-- 1 -->Changed" },
  { message = "^revert", group = "<!-- 3 -->Removed" },
  { message = "^fix", group = "<!-- 4 -->Fixed" },
  { message = "^(docs|test|ci|build|chore|style)", skip = true },
]
