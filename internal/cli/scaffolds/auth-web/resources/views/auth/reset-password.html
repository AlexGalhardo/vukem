{{define "title"}}Reset password{{end}}
{{define "content"}}
<h1>Choose a new password</h1>
<form method="post" action="{{route "password.update"}}">
	{{csrfField}}
	<input type="hidden" name="token" value="{{.Token}}">
	<label>Email
		<input type="email" name="email" value="{{or (old "email") .Email}}" required autocomplete="username">
	</label>
	{{with error "email"}}<p class="error">{{.}}</p>{{end}}
	<label>New password
		<input type="password" name="password" required minlength="12" autocomplete="new-password">
	</label>
	{{with error "password"}}<p class="error">{{.}}</p>{{end}}
	<label>Confirm password
		<input type="password" name="password_confirmation" required autocomplete="new-password">
	</label>
	{{with error "password_confirmation"}}<p class="error">{{.}}</p>{{end}}
	<button type="submit">Reset password</button>
</form>
{{end}}
