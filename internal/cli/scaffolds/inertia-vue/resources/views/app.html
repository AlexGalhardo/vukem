{{/* layout: none */}}<!doctype html>
<html lang="{{or locale "en"}}">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Vukem</title>
	<meta property="csp-nonce" nonce="{{cspNonce}}">
	<script nonce="{{cspNonce}}">
		// Apply the saved theme before paint: "dark", "light", or the system preference.
		try {
			const theme = localStorage.getItem("theme");
			const dark = theme ? theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
			document.documentElement.classList.toggle("dark", dark);
		} catch {}
	</script>
	{{vite "resources/css/app.css" "resources/js/app.ts"}}
	{{.Head}}
</head>
<body class="bg-white text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100">
	{{.Inertia}}
</body>
</html>
