<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex, nofollow">
	<title>{{.Title}} · {{.Panel.Title}}</title>
	<link rel="stylesheet" href="{{.Panel.CSS}}">
	<script src="{{.Panel.JS}}" defer{{with cspNonce}} nonce="{{.}}"{{end}}></script>
</head>
<body>
	<header class="topbar">
		<a class="brand" href="{{.Panel.Home}}">{{.Panel.Title}}</a>
		<a class="site" href="/">Back to site</a>
	</header>
	<div class="shell">
		<nav class="sidebar" aria-label="Resources">
			<a href="{{.Panel.Home}}">Dashboard</a>
			{{range .Panel.Nav}}<a href="{{.URL}}"{{if .Active}} aria-current="page"{{end}}>{{.Label}}</a>{{end}}
			{{with .Panel.FlagsURL}}<a href="{{.}}"{{if eq $.Title "Feature flags"}} aria-current="page"{{end}}>Feature flags</a>{{end}}
			{{with .Panel.AuditURL}}<a class="audit-link" href="{{.}}">Audit log</a>{{end}}
		</nav>
		<main id="main">
			{{with flash "admin.success"}}<p class="flash" role="status">{{.}}</p>{{end}}
			{{block "content" .}}{{end}}
		</main>
	</div>
</body>
</html>
