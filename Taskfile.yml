# yaml-language-server: $schema=https://taskfile.dev/schema.json
# Single entry point for local development and CI. Run `task --list`.
version: "3"

vars:
  # Every Go module in the repository (drivers and contrib modules are added as they land).
  MODULES: ". drivers/postgres drivers/mysql drivers/redis drivers/mongo drivers/otel drivers/s3 drivers/websocket contrib/stripe contrib/cloudflare contrib/graphql contrib/grpc contrib/imaging contrib/engine"
  # Same pin as the apidiff job in .github/workflows/ci.yml (x/exp has no tags).
  APIDIFF_VERSION: v0.0.0-20261014143641-f0251eb4aa3e

tasks:
  default:
    cmds:
      - task --list

  setup:
    desc: Install hooks and verify required tools
    cmds:
      - go version
      - golangci-lint version
      - lefthook version
      - lefthook install
      # Agent worktrees under .claude/worktrees/ outlive their branches.
      - git worktree prune

  hooks:
    desc: Install git hooks
    cmds:
      - lefthook install

  fmt:
    desc: Format Go code
    cmds:
      - for: { var: MODULES }
        cmd: cd {{.ITEM}} && golangci-lint fmt ./...

  lint:
    desc: Lint Go code and Markdown
    cmds:
      - task: lint:go
      - task: lint:md

  lint:go:
    desc: Run golangci-lint on every module
    cmds:
      - for: { var: MODULES }
        cmd: cd {{.ITEM}} && golangci-lint run ./...

  lint:md:
    desc: Run markdownlint
    cmds:
      - npx --yes markdownlint-cli2 "**/*.md"

  test:
    desc: Run unit tests (-short skips the slow end-to-end tests; see test:e2e)
    cmds:
      - for: { var: MODULES }
        cmd: cd {{.ITEM}} && go test -short -count=1 -timeout 20m ./...

  test:e2e:
    desc: "Run the tests -short skips: CLI scaffolds compiled and booted, generated clients, browser, engine helper"
    cmds:
      - go test -count=1 -timeout 30m ./internal/cli/ ./openapi/ ./apidocs/
      - cd contrib/engine && go test -count=1 -timeout 10m ./...

  test:race:
    desc: Run unit tests with the race detector (needs cgo/gcc)
    env:
      CGO_ENABLED: "1"
    cmds:
      - for: { var: MODULES }
        cmd: cd {{.ITEM}} && go test -race -count=1 ./...

  test:integration:
    desc: Run integration tests (needs DATABASE_URL, MYSQL_URL, MARIADB_URL, REDIS_URL, MONGO_URL, S3_ENDPOINT)
    cmds:
      - for: { var: MODULES }
        cmd: cd {{.ITEM}} && go test -tags=integration -count=1 ./...

  bench:
    desc: "Run core and comparative benchmarks (internal/bench: net/http, chi, echo); COUNT=6, compare runs with benchstat"
    vars:
      COUNT: '{{.COUNT | default "6"}}'
    cmds:
      - go test -run '^$' -bench . -benchmem -count {{.COUNT}} ./router ./web ./orm
      - cd internal/bench && go test -run '^$' -bench . -benchmem -count {{.COUNT}} .

  cover:
    desc: Write coverage.out, print the total and check the per-package gates
    cmds:
      - go test -count=1 -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out
      - go run ./internal/tools/covergate coverage.out

  vet:
    desc: Run go vet, preview go fix modernizations and check the //go:fix inline wrappers
    cmds:
      - go vet ./...
      - go fix -diff ./...
      - go run ./internal/tools/fixinline

  mod:check:
    desc: Fail when a nested module cannot be resolved from its own go.mod (GOWORK=off, test files included)
    cmds:
      - go run ./internal/tools/modcheck

  vuln:
    desc: Scan for known vulnerabilities
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  secrets:scan:
    desc: Scan the git history for secrets with Betterleaks v1.9.0 (pass -- --log-opts=main..HEAD for a range)
    cmds:
      - betterleaks version || (echo "install Betterleaks v1.9.0, e.g. go install github.com/betterleaks/betterleaks@v1.9.0" && exit 1)
      - betterleaks git . --config .betterleaks.toml --no-banner --redact {{.CLI_ARGS}}

  api:check:
    desc: Fail on incompatible API changes since the latest v1 tags (apidiff); pass -- -major v0 -report file.md for a report
    cmds:
      - go install golang.org/x/exp/cmd/apidiff@{{.APIDIFF_VERSION}}
      - go run ./internal/tools/apicheck {{.CLI_ARGS}}

  tidy:
    desc: Tidy every module
    cmds:
      - for: { var: MODULES }
        cmd: cd {{.ITEM}} && go mod tidy

  site:dev:
    desc: Run the documentation site locally
    dir: site
    cmds:
      - npm run dev

  site:build:
    desc: Build and lint the documentation site
    dir: site
    cmds:
      - npm ci
      - npm run lint
      - npm run build

  changelog:
    desc: Preview the next changelog section (does not write files)
    cmds:
      - git cliff --config .config/cliff.toml --unreleased --strip all

  snippets:check:
    desc: 'Fail when a go code block of the site docs uses an API that does not exist (mark fragments nocompile)'
    cmds:
      - go run ./internal/tools/snippetcheck

  release:
    desc: "Cut a release at the end of a PLAN.md task group: task release -- vX.Y.Z (runs ci:full first)"
    cmds:
      - task: ci:full
      - go run ./internal/tools/release -push {{.CLI_ARGS}}

  release:binaries:
    desc: "Build vukem binaries with GoReleaser in Docker; SNAPSHOT=1 builds without publishing (otherwise uploads to the release of the current tag; unsigned, release.yml signs)"
    cmds:
      - >-
        docker run --rm -v "{{.ROOT_DIR}}:/src" -w /src
        -e GITHUB_TOKEN="$(gh auth token)" -e GIT_CONFIG_COUNT=1
        -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src
        goreleaser/goreleaser:v2.18.2 release --clean --skip=sign {{if .SNAPSHOT}}--snapshot{{end}}

  test:linux:
    desc: Run unit tests with -race on Linux inside Docker (no local gcc needed)
    cmds:
      - docker run --rm -e GOWORK=off -v "{{.ROOT_DIR}}:/src" -v vukem-gomod:/go/pkg/mod -w /src golang:1.27 go test -race -count=1 ./...

  services:up:
    desc: Start Postgres, MySQL, MariaDB, Redis, Mongo and RustFS (S3) for integration tests (Docker)
    cmds:
      - docker compose -f .config/compose.yaml up -d --wait

  services:down:
    desc: Stop integration services
    cmds:
      - docker compose -f .config/compose.yaml down

  ci:
    desc: Fast local gate (lint, vet, unit tests)
    cmds:
      - task: lint
      - task: vet
      - task: mod:check
      - task: snippets:check
      - task: test

  ci:full:
    desc: Full pipeline run locally before every release (mirrors GitHub Actions)
    env:
      DATABASE_URL: postgres://vukem:vukem@localhost:55432/vukem_test?sslmode=disable
      MYSQL_URL: mysql://vukem:vukem@localhost:53306/vukem_test
      MARIADB_URL: mariadb://vukem:vukem@localhost:53307/vukem_test
      REDIS_URL: redis://localhost:56379/0
      MONGO_URL: mongodb://localhost:57017
      S3_ENDPOINT: http://localhost:59000
    cmds:
      - task: lint
      - task: vet
      - task: mod:check
      - task: snippets:check
      - task: test
      - task: test:e2e
      - task: test:linux
      - task: services:up
      - task: test:integration
      - task: vuln
      - task: site:build
      - task: cover
