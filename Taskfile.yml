# yaml-language-server: $schema=https://taskfile.dev/schema.json
# Single entry point for local development and CI. Run `task --list`.
version: "3"

vars:
  # Every Go module in the repository (drivers are added as they land).
  MODULES: "."

tasks:
  default:
    cmds:
      - task --list

  setup:
    desc: Install hooks and verify required tools
    cmds:
      - go version
      - golangci-lint version
      - lefthook version
      - lefthook install

  hooks:
    desc: Install git hooks
    cmds:
      - lefthook install

  fmt:
    desc: Format Go code
    cmds:
      - for: { var: MODULES }
        cmd: cd {{.ITEM}} && golangci-lint fmt ./...

  lint:
    desc: Lint Go code and Markdown
    cmds:
      - task: lint:go
      - task: lint:md

  lint:go:
    desc: Run golangci-lint on every module
    cmds:
      - for: { var: MODULES }
        cmd: cd {{.ITEM}} && golangci-lint run ./...

  lint:md:
    desc: Run markdownlint
    cmds:
      - npx --yes markdownlint-cli2 "**/*.md"

  test:
    desc: Run unit tests
    cmds:
      - for: { var: MODULES }
        cmd: cd {{.ITEM}} && go test -count=1 ./...

  test:race:
    desc: Run unit tests with the race detector (needs cgo/gcc)
    env:
      CGO_ENABLED: "1"
    cmds:
      - for: { var: MODULES }
        cmd: cd {{.ITEM}} && go test -race -count=1 ./...

  test:integration:
    desc: Run integration tests (needs DATABASE_URL, REDIS_URL, MONGO_URL)
    cmds:
      - for: { var: MODULES }
        cmd: cd {{.ITEM}} && go test -tags=integration -count=1 ./...

  cover:
    desc: Write coverage.out and print the total
    cmds:
      - go test -count=1 -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  vet:
    desc: Run go vet and preview go fix modernizations
    cmds:
      - go vet ./...
      - go fix -diff ./...

  vuln:
    desc: Scan for known vulnerabilities
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  tidy:
    desc: Tidy every module
    cmds:
      - for: { var: MODULES }
        cmd: cd {{.ITEM}} && go mod tidy

  site:dev:
    desc: Run the documentation site locally
    dir: site
    cmds:
      - npm run dev

  site:build:
    desc: Build and lint the documentation site
    dir: site
    cmds:
      - npm ci
      - npm run lint
      - npm run build

  changelog:
    desc: Preview the next changelog section (does not write files)
    cmds:
      - git cliff --unreleased --strip all

  release:
    desc: "Cut a release at the end of a PLAN.md task group: task release -- vX.Y.Z (runs ci:full first)"
    cmds:
      - task: ci:full
      - go run ./internal/tools/release -push {{.CLI_ARGS}}

  test:linux:
    desc: Run unit tests with -race on Linux inside Docker (no local gcc needed)
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/src" -v lumek-gomod:/go/pkg/mod -w /src golang:1.27 go test -race -count=1 ./...

  services:up:
    desc: Start Postgres, Redis and Mongo for integration tests (Docker)
    cmds:
      - docker compose up -d --wait

  services:down:
    desc: Stop integration services
    cmds:
      - docker compose down

  ci:
    desc: Fast local gate (lint, vet, unit tests)
    cmds:
      - task: lint
      - task: vet
      - task: test

  ci:full:
    desc: Full pipeline run locally before every release (mirrors GitHub Actions)
    env:
      DATABASE_URL: postgres://lumek:lumek@localhost:55432/lumek_test?sslmode=disable
      REDIS_URL: redis://localhost:56379/0
      MONGO_URL: mongodb://localhost:57017
    cmds:
      - task: lint
      - task: vet
      - task: test
      - task: test:linux
      - task: services:up
      - task: test:integration
      - task: vuln
      - task: site:build
      - task: cover
