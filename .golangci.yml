# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json
version: "2"

run:
  timeout: 5m
  relative-path-mode: gomod
  tests: true

formatters:
  enable:
    - gofumpt
    - gci
    - golines
  settings:
    gofumpt:
      module-path: github.com/AlexGalhardo/vukem
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/AlexGalhardo/vukem)
    golines:
      max-len: 120
      tab-len: 4
      shorten-comments: false
      reformat-tags: true
  exclusions:
    generated: lax
    paths:
      - site/
      - testdata/ # golden files must stay byte-for-byte

linters:
  default: standard
  enable:
    # correctness
    - bodyclose
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - makezero
    - musttag
    - nilerr
    - noctx
    - reassign
    - rowserrcheck
    - sqlclosecheck
    # security and dependencies
    - depguard
    - gosec
    # style and API quality
    - copyloopvar
    - exptostd
    - gocheckcompilerdirectives
    - gocritic
    - godot
    - intrange
    - misspell
    - modernize
    - nakedret
    - nolintlint
    - perfsprint
    - predeclared
    - revive
    - sloglint
    - unconvert
    - unparam
    - usestdlibvars
    # tests
    - thelper
    - tparallel
    - usetesting
  settings:
    depguard:
      rules:
        core:
          list-mode: lax
          files:
            - "!**/drivers/**"
          deny:
            - pkg: github.com/AlexGalhardo/vukem/drivers
              desc: core must not import driver modules (docs/architecture.md#module-boundaries)
            - pkg: github.com/stretchr/testify
              desc: use the standard library and go-cmp (docs/testing.md)
            - pkg: gorm.io
              desc: not in the dependency allowlist (docs/architecture.md#dependency-policy)
    errcheck:
      check-type-assertions: true
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - hugeParam
        - paramTypeCombine
        - unnamedResult
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: exported
        - name: package-comments
        - name: receiver-naming
        - name: unexported-return
        - name: unused-parameter
        - name: var-naming
    sloglint:
      context: scope
  exclusions:
    generated: lax
    paths:
      - site/
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - forcetypeassert
          - gosec
          - noctx

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
