# Regenerate from this directory:
#   go run github.com/bufbuild/buf/cmd/buf@v1.74.0 generate
version: v2
plugins:
  - local: ["go", "run", "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12"]
    out: gen
    opt: paths=source_relative
  - local: ["go", "run", "connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.21.1"]
    out: gen
    opt: paths=source_relative
