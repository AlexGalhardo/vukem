{{define "title"}}New {{.Table.Name}} row - vukem-studio{{end}}
{{define "content"}}
<div class="mb-4 flex flex-wrap items-center gap-3">
	<h1 class="text-2xl font-semibold">{{.Source}} / {{.Table.Name}} / new row</h1>
	<a class="btn btn-ghost" href="/s/{{path .Source}}/t/{{path .Table.Name}}">Cancel</a>
</div>
<form method="post" action="/s/{{path .Source}}/t/{{path .Table.Name}}" class="card">
	<p class="text-sm text-muted-foreground">A column left empty gets the database default.</p>
	{{range .Table.Columns}}<div class="grid gap-2 sm:grid-cols-[12rem_1fr]">
		<label class="text-sm font-medium" for="col-{{.Name}}">{{.Name}} <span class="text-xs text-muted-foreground">{{.Type}}</span></label>
		<div class="flex items-center gap-2">
			<textarea class="input" id="col-{{.Name}}" name="col.{{.Name}}" rows="1"></textarea>
			{{if .Nullable}}<label class="flex items-center gap-1 text-xs"><input type="checkbox" name="null.{{.Name}}" value="1"> NULL</label>{{end}}
		</div>
	</div>{{end}}
	<button class="btn btn-default self-start">Insert</button>
</form>
{{end}}
