{{define "title"}}Error - vukem-studio{{end}}
{{define "content"}}
<h1 class="mb-4 text-2xl font-semibold">Something went wrong</h1>
<div class="card" role="alert"><p class="text-sm break-words">{{.Message}}</p></div>
{{if .Typed}}<h2 class="mt-4 mb-2 text-lg font-semibold">What you typed</h2>
<dl class="card grid gap-2 sm:grid-cols-[12rem_1fr]">
	{{range .Typed}}<dt class="text-sm font-medium">{{.Name}}</dt><dd class="text-sm break-words"><pre class="whitespace-pre-wrap">{{.Text}}</pre></dd>{{end}}
</dl>{{end}}
<p class="mt-4 flex gap-2">{{if .Back}}<a class="btn btn-default" data-back href="{{.Back}}">Back to the form</a>{{end}}<a class="btn btn-secondary" href="/">Back to the sources</a></p>
{{end}}
