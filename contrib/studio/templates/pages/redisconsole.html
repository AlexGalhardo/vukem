{{define "title"}}Console - vukem-studio{{end}}
{{define "content"}}
<h1 class="mb-4 text-2xl font-semibold">{{.Source}} / console</h1>
<form method="post" data-console class="card mb-4">
	<input class="input" name="line" value="{{.Line}}" placeholder="GET session:abc" aria-label="Redis command" autocomplete="off">
	<button class="btn btn-default self-start">Run (Ctrl+Enter)</button>
</form>
{{if .Error}}<div class="card mb-4" role="alert"><p class="text-sm break-words">{{.Error}}</p></div>{{end}}
{{if .Result}}<pre class="card overflow-x-auto text-sm">{{.Result}}</pre>{{end}}
{{end}}
