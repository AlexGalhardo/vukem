{{/* A table. Data: Head (strings) and Rows (lists of cells with Text, Null and Link). */}}
{{define "partials/table"}}<div class="overflow-x-auto rounded-xl border">
<table class="table">
	<thead><tr>{{range .Head}}<th scope="col">{{.}}</th>{{end}}</tr></thead>
	<tbody>{{range .Rows}}<tr>{{range .}}<td>{{if .Null}}<span class="null-cell">NULL</span>{{else if .Link}}<a class="underline" href="{{.Link}}">{{.Text}}</a>{{else}}{{.Text}}{{end}}</td>{{end}}</tr>{{end}}</tbody>
</table>
</div>{{end}}
