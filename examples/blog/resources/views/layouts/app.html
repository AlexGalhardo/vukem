<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{block "title" .}}Vukem{{end}}</title>
	<link rel="stylesheet" href="{{asset "css/app.css"}}">
	{{htmxScript (asset "js/htmx.min.js")}}
</head>
<body>
	<header>
		<a href="{{route "home"}}" class="brand">Vukem</a>
		<nav><a href="{{route "posts.index"}}">Posts</a></nav>
	</header>
	<main>
		{{with flash "success"}}<p class="flash" role="status">{{.}}</p>{{end}}
		{{block "content" .}}{{end}}
	</main>
</body>
</html>
